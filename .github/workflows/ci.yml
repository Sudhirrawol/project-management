name: Project Management CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend/api-gateway
          - backend/auth-service
          - backend/project-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build TypeScript
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: docker build -t project-management-service .
